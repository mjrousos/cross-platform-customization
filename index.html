<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Guessing Game</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #f4f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 520px;
      margin: 3rem auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    .controls {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
    }
    input {
      flex: 1;
      font-size: 1rem;
      padding: 0.6rem;
    }
    button {
      font-size: 1rem;
      padding: 0.6rem 0.9rem;
      cursor: pointer;
    }
    #message {
      margin-top: 1rem;
      font-weight: 600;
    }
    ul {
      margin-top: 1rem;
      padding-left: 1.2rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>I'm thinking of a number from 1 to 100.</h1>
    <p>Enter your guess to find the secret number.</p>
    <div class="controls">
      <input id="guessInput" type="number" min="1" max="100" placeholder="Enter your guess" autocomplete="off">
      <button id="guessButton" type="button">Guess</button>
      <button id="newGameButton" type="button" hidden>New game</button>
    </div>
    <p id="message" aria-live="polite"></p>
    <ul id="history"></ul>
  </main>
  <script>
    const guessInput = document.getElementById('guessInput');
    const guessButton = document.getElementById('guessButton');
    const newGameButton = document.getElementById('newGameButton');
    const message = document.getElementById('message');
    const history = document.getElementById('history');

    let target = 0;
    let attempts = 0;
    let gameOver = false;

    function randomTarget() {
      return Math.floor(Math.random() * 100) + 1;
    }

    function addHistoryLine(guess, result) {
      const line = document.createElement('li');
      line.textContent = guess + ' → ' + result;
      history.appendChild(line);
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function startNewGame() {
      target = randomTarget();
      attempts = 0;
      gameOver = false;
      history.innerHTML = '';
      guessInput.disabled = false;
      guessButton.disabled = false;
      newGameButton.hidden = true;
      setMessage('');
      guessInput.value = '';
      guessInput.focus();
    }

    function submitGuess() {
      if (gameOver) {
        return;
      }

      const raw = guessInput.value.trim();
      if (!/^-?\d+$/.test(raw)) {
        setMessage('Please enter a whole number.');
        return;
      }

      const guess = Number(raw);
      if (guess < 1 || guess > 100) {
        setMessage('Please enter a number from 1 to 100.');
        return;
      }

      attempts += 1;

      if (guess < target) {
        setMessage('Too low. Try again.');
        addHistoryLine(guess, 'Too low');
      } else if (guess > target) {
        setMessage('Too high. Try again.');
        addHistoryLine(guess, 'Too high');
      } else {
        setMessage('Correct! You guessed the number in ' + attempts + ' tries.');
        addHistoryLine(guess, 'Correct');
        gameOver = true;
        guessInput.disabled = true;
        guessButton.disabled = true;
        newGameButton.hidden = false;
      }
    }

    guessButton.addEventListener('click', submitGuess);
    newGameButton.addEventListener('click', startNewGame);
    guessInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        submitGuess();
      }
    });

    startNewGame();
  </script>
</body>
</html>
